# Local development. Secrets come from .env (git-ignored).
services:
  go:
    image: golang:1.26
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    environment:
      - GOFLAGS=-buildvcs=false
    profiles: ["tools"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mytunnel}
      POSTGRES_USER: ${DB_USERNAME:-mytunnel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
volumes:
  pgdata:
  gomod:
  gocache:
