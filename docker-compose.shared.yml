# For a server that ALREADY runs nginx on 80/443 and other projects.
# Only 127.0.0.1 ports + the control port 4443 are published; own isolated postgres/redis (no host ports).
# Run: docker compose -p publish -f docker-compose.shared.yml --env-file .env.production up -d
services:
  tunnel-server:
    build: { context: ., dockerfile: deploy/docker/Dockerfile.server }
    restart: unless-stopped
    env_file: .env.production
    environment:
      REDIS_ADDR: redis:6379
      INTERNAL_API_URL: http://web:8080
      DASHBOARD_UPSTREAM: http://web:8080
      ADMIN_LISTEN_ADDR: 0.0.0.0:9090   # container-internal only, not published
      PUBLIC_HTTPS_PORT: "${PUBLISH_LOCAL_PORT:-18443}"
      TUNNEL_CONTROL_PORT: "${TUNNEL_CONTROL_PORT:-47443}"
      TLS_MODE: file
      TLS_CERT_FILE: /ssl/fullchain.pem
      TLS_KEY_FILE: /ssl/key.pem
    ports:
      - "127.0.0.1:${PUBLISH_LOCAL_PORT:-18443}:${PUBLISH_LOCAL_PORT:-18443}"   # localhost only; host nginx proxies *.domain here
      - "${TUNNEL_CONTROL_PORT:-47443}:${TUNNEL_CONTROL_PORT:-47443}"   # the ONLY public port: CLI control connections
    volumes: ["/etc/ssl/publish:/ssl:ro"]
    depends_on: [redis, web]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  api:
    build: { context: ., dockerfile: deploy/docker/Dockerfile.api }
    restart: unless-stopped
    env_file: .env.production
    environment: { DB_HOST: postgres, REDIS_HOST: redis, APP_ENV: production, APP_DEBUG: "false", CLI_DIST_DIR: /cli }
    volumes: ["./dist/cli:/cli:ro"]   # built by deploy/release/build-cli.sh; served on the Install page
    depends_on: [postgres, redis]
  scheduler:
    build: { context: ., dockerfile: deploy/docker/Dockerfile.api }
    restart: unless-stopped
    env_file: .env.production
    environment: { DB_HOST: postgres, REDIS_HOST: redis, APP_ENV: production }
    command: sh -c 'while true; do php artisan schedule:run --no-interaction; sleep 60; done'
    depends_on: [postgres, redis]
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLISH_PORTAL_PORT:-8010}:8090"   # dashboard/portal (public); /internal is blocked on this listener
    volumes: ["./deploy/docker/nginx-api.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
volumes: { pgdata: {}, redisdata: {} }
