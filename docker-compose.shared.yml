# For a server that ALREADY runs nginx on 80/443 and other projects.
# Only 127.0.0.1 ports + the control port 4443 are published; own isolated postgres/redis (no host ports).
# Run: docker compose -p publish -f docker-compose.shared.yml --env-file .env.production up -d
services:
  tunnel-server:
    build: { context: ., dockerfile: deploy/docker/Dockerfile.server }
    restart: unless-stopped
    env_file: .env.production
    environment:
      REDIS_ADDR: redis:6379
      INTERNAL_API_URL: http://web:8080
      DASHBOARD_UPSTREAM: http://web:8080
      ADMIN_LISTEN_ADDR: 0.0.0.0:9090
      PUBLIC_HTTPS_PORT: "8443"
      TLS_MODE: file
      TLS_CERT_FILE: /ssl/fullchain.pem
      TLS_KEY_FILE: /ssl/key.pem
    ports:
      - "127.0.0.1:8443:8443"   # tunnel public side (TLS); host nginx proxies *.domain here
      - "4443:4443"             # CLI control connections (public)
    volumes: ["/etc/ssl/publish:/ssl:ro"]
    depends_on: [redis, web]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  api:
    build: { context: ., dockerfile: deploy/docker/Dockerfile.api }
    restart: unless-stopped
    env_file: .env.production
    environment: { DB_HOST: postgres, REDIS_HOST: redis, APP_ENV: production, APP_DEBUG: "false" }
    depends_on: [postgres, redis]
  scheduler:
    build: { context: ., dockerfile: deploy/docker/Dockerfile.api }
    restart: unless-stopped
    env_file: .env.production
    environment: { DB_HOST: postgres, REDIS_HOST: redis, APP_ENV: production }
    command: sh -c 'while true; do php artisan schedule:run --no-interaction; sleep 60; done'
    depends_on: [postgres, redis]
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes: ["./deploy/docker/nginx-api.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
volumes: { pgdata: {}, redisdata: {} }
