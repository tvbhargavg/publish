groups:
  - name: publish
    rules:
      - alert: TunnelServerDown
        expr: up{job="publish"} == 0
        for: 1m
        labels: { severity: critical }
      - alert: High5xxRate
        expr: rate(publish_requests_total{class="5xx"}[5m]) > 5
        for: 5m
        labels: { severity: warning }
      - alert: AuthFailureSpike
        expr: rate(publish_auth_failures_total[5m]) > 2
        for: 5m
        labels: { severity: warning }
      - alert: RateLimitingHeavy
        expr: rate(publish_rate_limited_total[5m]) > 20
        for: 10m
        labels: { severity: info }
