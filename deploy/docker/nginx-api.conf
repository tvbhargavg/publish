# Internal nginx in front of php-fpm; only reachable on the compose network
# (the tunnel server proxies app.<domain> here; /internal/* is blocked there).
server {
    listen 8080;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 5m;
    server_tokens off;
    location / { try_files $uri /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $http_x_forwarded_proto;
    }
    location ~ /\.(?!well-known) { deny all; }
}

# Public portal listener (published on the host as PUBLISH_PORTAL_PORT, default 8010).
# Same app, but /internal/* (server-to-server API) is never reachable from outside.
server {
    listen 8090;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 5m;
    server_tokens off;
    location ^~ /internal { return 404; }
    location / { try_files $uri /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $http_x_forwarded_proto;
    }
    location ~ /\.(?!well-known) { deny all; }
}
